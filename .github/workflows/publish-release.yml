name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run electron:build -- --publish never

      - name: Publish release and update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "$env:RELEASE_TAG" `
            "release\aptPOS-Setup-$version.exe" `
            "release\aptPOS-Setup-$version.exe.blockmap" `
            "release\latest.yml" `
            --title "aptPOS $version" `
            --generate-notes
